<!-- PAYENCASH SOLUTION — COMPTE (23/09, fondatrice : « page du compte avec les CGU, CGV etc., gros cadre
     juridique, KYB etc. » ; le soir : « créer un menu avec des pages pour chaque section », « où je déclare le
     dirigeant ? », « restructure tout, hiérarchise bien »).
     C'EST LA PAGE QUI ENGAGE. Un HUB (l'identité en tête, ce qui bloque, sept lignes de menu au résumé DÉRIVÉ), puis
     une page par section (?s=…), dans cet ordre :
       ① IDENTITÉ — l'identité légale déclarée et ce que le contrôle a relevé ; le DIRIGEANT (prénom, nom, qualité :
         c'est lui qui signe) ; le DOSSIER DE VÉRIFICATION (KYB) pièce par pièce, déposé ici — tant qu'il n'est pas
         contrôlé, le compte est INACTIF ;
       ② DOCUMENTS — chaque document lu (dans le lecteur intégré, jusqu'au bout) puis accepté dans sa VERSION ; le
         CONTRAT-CADRE, généré du modèle du coffre, lu et signé par le dirigeant une fois sa pièce d'identité
         contrôlée (KYC), contresigné par nous ; la DÉCLARATION « réseau limité », déposée, statuée, corrigeable ;
       ③ PAIEMENT — l'offre (à quel prix nous achetons ses bons, sous quel délai nous la payons) et le RIB, proposé
         depuis le dossier contrôlé ; ④ ABONNEMENT — le logiciel d'édition, le quota du mois, le site web ;
       ⑤ INTÉGRATION — les clés d'API, le bouton du site, les réseaux sociaux ; ⑥ RÈGLES — seuil ACPR, plafonds,
         LCB-FT, chaque texte à sa source ; ⑦ MENTIONS — ce que nous sommes pour elle, l'éditeur, le cadre.
     TOUT MESSAGE QUI DEMANDE UN GESTE EST UN LIEN VERS L'ENDROIT EXACT (?s=section#ancre : la carte visée se signale).
     LA CLÉ SECRÈTE est tirée du générateur sûr du navigateur, montrée UNE FOIS, et seule son empreinte SHA-256 est
     conservée : perdue, elle ne se retrouve pas — elle se révoque et se refait. L'écran le dit.
     TOUT EST DÉRIVÉ : le dossier vient du coffre (PEC_DOCS), les acceptations de `documentsEtat`, les textes et les
     nombres du référentiel. L'écran n'écrit rien qu'il n'ait lu — et ce qui manque, il le dit, avec son adresse. -->

     précédente, pas à l'accueil du site ; beaucoup de pages ne sont pas au bon format ») LES DOCUMENTS SE LISENT ICI,
     dans un lecteur qui couvre l'écran et se referme sur la page d'où l'on vient — jamais dans un onglet qui mène à

<script>
(function () {
  'use strict';
  var D = window.PEC_DATA, T = window.PEC_TECH, $ = function (i) { return document.getElementById(i); };
  if (window.PEC_TECH) { PEC_TECH.entete('tk-entete'); PEC_TECH.menu('tk-menu', '10-compte.html'); }
  if (!D || !D.techRef || !T) return;
  var esc = function (v) { return D.esc(v); };

  var s = T.session('marchand');
  if (!s || !D.techMarchand(s.id)) { $('tc-garde').hidden = false; return; }
  $('tc-corps').hidden = false;

  /* ══ (23/09, fondatrice : « dans Compte, créer un menu avec des pages pour chaque section, sinon c'est trop lourd ;
     respecter la hiérarchie de l'information, regrouper par logique ») UN MENU, SEPT PAGES, UNE SEULE SOURCE ═══════
     Treize cartes empilées sur un écran de téléphone, c'était un mur. Chaque carte se range dans une section ; sans
     `?s=`, l'écran est le HUB (l'identité en tête, sept lignes de menu avec un résumé DÉRIVÉ) ; avec `?s=`, il ne peint
     que cette section. Les cartes ne sont pas recopiées dans sept fichiers : `carte()` les range, `peindre()` choisit.
     C'est la même peinture, donc les mêmes ids, donc le même banc. Les descriptions sont courtes : la sous-navigation
     les écrit sur une ligne. */
  var SECTIONS = [
    ['identite',    'Mon identité et mon dossier',   'identité légale, dirigeant, dossier de vérification (KYB)',   'Identité'],
    ['documents',   'Mes documents et mon contrat',  'documents lus et acceptés, contrat-cadre, déclaration',       'Documents'],
    ['paiement',    'Paiement',                      'modalités de paiement de tes bons, RIB',                       'Paiement'],
    ['abonnement',  'Abonnement',                    'logiciel d’édition, quota du mois, factures, site web',        'Abonnement'],
    ['integration', 'Intégration et réseaux',        'clés d’API, bouton de ton site, réseaux sociaux',              'Intégration'],
    ['regles',      'Seuils et règles',              'seuil ACPR, plafonds au comptoir, prévention de la fraude',    'Règles'],
    ['juridique',   'Mentions légales',              'ce que nous sommes pour toi, l’éditeur, les textes',           'Mentions']
  ];
  var parts = {}, secCourante = null;
  var sectionDemandee = (function () { try { return new URLSearchParams(location.search).get('s') || ''; } catch (e) { return ''; } })();
  var secDemandee = SECTIONS.filter(function (x) { return x[0] === sectionDemandee; })[0] || null;
  /* (23/09, soir — fondatrice : « revérifie la navigation de Compte page par page, le retour arrière, où sont les
     onglets » ; « si je lis, je ferme le doc, je dois revenir à la page précédente, pas à l'accueil ») LE HAUT DE PAGE DIT
     OÙ L'ON EST : sur le hub, l'en-tête léger ; dans une section, le rond de retour, le titre et les onglets de toutes les
     sections — on passe de l'une à l'autre sans repasser par le hub. LE ROND RAMÈNE D'OÙ L'ON VIENT : arrivé par un
     « régler › » de Bon d'achat, de Paiement ou d'Outils, il y ramène et le nomme ; arrivé du hub, d'une autre section ou
     de nulle part, il ramène au hub. Le référent est lu par le navigateur, jamais écrit dans l'adresse. */
  function retourDe() {
    var hub = { href: '10-compte.html', lbl: 'Compte' };
    try {
      var ref = document.referrer ? new URL(document.referrer) : null;
      if (!ref || ref.origin !== location.origin) return hub;
      var f = ref.pathname.split('/').pop();
      var e = (T.ESPACES.marchand || []).filter(function (x) { return x.href === f && f !== '10-compte.html'; })[0];
      return e ? { href: f, lbl: e.lbl } : hub;
    } catch (e0) { return hub; }
  }
  if (secDemandee) {
    T.sousNav('tk-hero', { teinte: 'compte', retour: retourDe(), titre: secDemandee[1], sous: secDemandee[2], ongletsLbl: 'Sections du compte',
      onglets: SECTIONS.map(function (x) { return { href: '10-compte.html?s=' + x[0], lbl: x[3], cle: x[0], actif: x[0] === secDemandee[0] }; }) });
  } else {
    T.hero('tk-hero', { teinte: 'compte', ico: 'i-user', eyebrow: 'Compte', idTitre: 'tc-titre', idSub: 'tc-sub', promesse: 'Ton dossier, tes documents, ton contrat — tout ce qui te lie à nous.', etapes: ['Ton dossier de vérification, contrôlé une fois : le compte s’active', 'Chaque document lu et accepté, le contrat-cadre signé par ton dirigeant', 'Tu édites tes bons, le réseau les achète ; nous te payons à l’échéance de ton offre'] });
  }
  /* L'ANCRE D'UNE CARTE — celle que visent les liens « régler › » (`?s=…#ancre`) : donnée par l'appel, sinon déduite du titre.
     Une carte sans ancre serait une carte qu'aucun raccourci ne peut cibler. */
  function ancreDe(titre) {
    var t = String(titre || '').toLowerCase();
    var T = [[/contrat/, 'contrat'], [/déclaration/, 'declaration'], [/documents/, 'documents'], [/dirigeant/, 'dirigeant'], [/dossier/, 'dossier'], [/identité/, 'identite'],
      [/rib/, 'rib'], [/modalités/, 'modalites'], [/abonnement/, 'abonnement'], [/site web/, 'site'], [/^api/, 'api'], [/réseaux/, 'reseaux'], [/seuils/, 'regles'], [/mentions/, 'mentions'], [/cadre juridique/, 'cadre']];
    for (var i = 0; i < T.length; i++) if (T[i][0].test(t)) return T[i][1];
    return null;
  }
  function carte(titre, corps, ancre) {
    if (!ancre) ancre = ancreDe(titre.replace(/<[^>]+>/g, ''));
    var html = '<p class="pec-section-label" style="margin:18px 0 6px"' + (ancre ? ' id="tc-carte-' + ancre + '"' : '') + '>' + titre + '</p>'
      + '<div class="pec-card"' + (ancre ? ' data-carte="' + ancre + '"' : '') + '>' + corps + '</div>';
    if (secCourante) { parts[secCourante] = (parts[secCourante] || '') + html; return ''; }
    return html;
  }
  function pill(t, cls) { return '<span class="pec-pill ' + cls + '" style="flex:none;font-size:9.5px;padding:3px 8px">' + esc(t) + '</span>'; }
  var pc = function (x) { return String(x).replace('.', ',') + ' %'; };
  /* LE SECRET NE VIT QUE DANS CETTE VARIABLE, le temps de l'écran : ni stockage, ni rechargement. */
  var secretVu = null;

  function peindre() {
    var a = D.techMarchand(s.id);

    secCourante = 'identite'; h += carte('Mon identité légale',

  }
  /* (23/09, soir — fondatrice : « le même procès pour signer un document sur l'app Solution que celui de l'utilisateur :
     il défile et signe ») LA FIN DU TEXTE OUVRE LE GESTE. Le lecteur suit le défilement : tant que le bas du document
     n'est pas atteint, le pied dit « fais défiler jusqu'au bout » ; à la fin, la consultation est notée (c'est elle,
     et non l'ouverture, qui vaut lecture) et le bouton s'active — « j'ai lu et j'accepte » pour un document, la case
     et « Signer » pour le contrat-cadre. Un texte plus court que l'écran compte comme lu dès l'affichage. */
  var lecteurCle = null, lecteurContrat = false, finLue = false, lecteurCharge = false;
  var FIN = '<p style="margin:18px 0 0;padding-top:10px;border-top:1px dashed var(--color-sep);font-size:11px;color:var(--color-muted);text-align:center">— fin du document —</p>';
  function lecteurFin() {
    var c = $('tc-lect-corps'); if (!c) return;
    /* (23/09, nuit — DOC·549 en série) LA FIN NE SE MESURE QUE SUR UN TEXTE POSÉ. Fermer le lecteur vide son corps, et
       le navigateur signale ce défilement à l'image suivante — sous charge, APRÈS l'ouverture du document suivant :
       « Chargement du document… » tenait dans l'écran, la fin était « atteinte », la consultation notée avant lecture. */
    if (!lecteurCharge || !c.clientHeight) return;
    var bas = c.scrollTop + c.clientHeight >= c.scrollHeight - 24;
    if (!bas || finLue) return;
    finLue = true;
    if (lecteurCle) D.documentConsulter('marchand', s.id, lecteurCle, s.id);
    lecteurPied();
    setTimeout(peindre, 30);
  }
  function lecteurOuvrir(o) {
    var z = $('tc-lecteur'); if (!z) return;
    lecteurCle = o.cle || null; lecteurContrat = !!o.contrat; finLue = false; lecteurCharge = false;
    $('tc-lect-titre').textContent = o.titre || 'Document';
    $('tc-lect-version').textContent = o.version ? 'v. ' + o.version : '';
    var corps = $('tc-lect-corps'); corps.innerHTML = '<p style="color:var(--color-muted)">Chargement du document…</p>';
    z.hidden = false;
    lecteurPied();
    var afficherCadre = function (src) { corps.innerHTML = ''; var f = document.createElement('iframe'); f.src = src; f.title = o.titre || 'Document'; f.style.cssText = 'width:100%;height:100%;min-height:60vh;border:0;background:#fff'; corps.appendChild(f); setTimeout(lecteurFin, 300); };
    /* le texte est déjà là (le contrat, rendu de son modèle) : on le pose, la fin se détecte comme pour les autres */
    if (o.html) { corps.innerHTML = o.html + FIN; corps.scrollTop = 0; lecteurCharge = true; setTimeout(lecteurFin, 120); return; }
    /* le PDF signé du coffre : dans son cadre — c'est le document tel qu'il a été signé, pas une relecture du modèle */
    if (o.iframeSrc) { afficherCadre(o.iframeSrc); return; }
    var url = o.url;
    try {
      fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var titre = doc.querySelector('header h1, h1');
        var body = doc.querySelector('.sheet .body') || doc.querySelector('main') || doc.querySelector('article') || doc.body;
        if (!body) { afficherCadre(url); return; }
        ['script', 'style', 'link', '.toolbar', 'nav', 'header', '.toc'].forEach(function (sel) { [].forEach.call(body.querySelectorAll(sel), function (n) { n.remove(); }); });
        [].forEach.call(body.querySelectorAll('a[href]'), function (n) { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener'); });
        var titreTxt = titre ? titre.innerHTML.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim() : '';
        corps.innerHTML = (titreTxt ? '<h1>' + esc(titreTxt) + '</h1>' : '') + body.innerHTML + FIN;
        corps.scrollTop = 0; lecteurCharge = true;
        setTimeout(lecteurFin, 120);   // un texte plus court que l'écran est lu d'emblée
      }).catch(function () { afficherCadre(url); });
    } catch (e0) { afficherCadre(url); }
  }
  $('tc-lect-corps').addEventListener('scroll', lecteurFin, { passive: true });
  /* LE PIED DU LECTEUR SUIT L'ÉTAT RÉEL : le défilement, puis l'acceptation ou la signature posée par le data-layer. */
  function lecteurPied() {
    var p = $('tc-lect-pied'); if (!p) return;
    p.hidden = false;
    var aide = finLue ? '' : '<p class="s">Fais défiler le texte jusqu’au bout : c’est là que tu ' + (lecteurContrat ? 'signes' : 'acceptes') + '.</p>';
    if (lecteurContrat) {
      var mC = D.techMarchand(s.id) || {}, dirC = D.techMarchandDirigeant(mC), kycC = D.techKycDirigeant(s.id);
      if (mC.contratSigneLe) { p.innerHTML = '<button type="button" class="pec-cta tap" id="tc-lect-retour">Signé le ' + esc(new Date(mC.contratSigneLe).toLocaleDateString('fr-FR')) + ' par ' + esc(mC.contratSignataire || '') + ' — revenir</button>'; return; }
      p.innerHTML = (dirC
          ? '<label style="display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.5;color:var(--color-muted)"><input type="checkbox" id="tc-contrat-ok" style="margin-top:2px;flex:none"' + (finLue ? '' : ' disabled') + '> <span>Moi, <b style="color:var(--color-ink)">' + esc(dirC.nomComplet) + '</b>, ' + esc(dirC.qualite) + ' de ' + esc(mC.raisonSociale) + ', j’ai lu le contrat-cadre et ses annexes, et je le signe au nom de ' + esc(mC.raisonSociale) + '.</span></label>'
            + (kycC.ok ? '' : '<p class="s" style="color:var(--color-amber-text);text-align:left">' + esc(kycC.motif) + '</p>')
          : '<p class="s" style="color:var(--color-amber-text)">Aucun dirigeant déclaré : déclare-le dans « Identité » — c’est lui qui signe.</p>')
        + '<button type="button" class="pec-cta tap" id="tc-contrat-go" style="margin-top:9px"' + (finLue && dirC ? '' : ' disabled') + '>Signer le contrat-cadre</button>' + aide;
      return;
    }
    if (!lecteurCle) { p.innerHTML = '<button type="button" class="pec-cta tap" id="tc-lect-retour">Revenir à mes documents</button>'; return; }
    var ed = D.documentsEtat('marchand', s.id).filter(function (x) { return x.cle === lecteurCle; })[0];
    if (!ed) { p.hidden = true; return; }
    p.innerHTML = ed.aJour
      ? '<button type="button" class="pec-cta tap" id="tc-lect-retour">' + (ed.information ? 'Lu le ' : 'Lu et accepté le ') + esc(new Date(ed.accepteLe).toLocaleDateString('fr-FR')) + ' — revenir</button>'
      : '<button type="button" class="pec-cta tap" data-doc-ok="' + esc(ed.cle) + '"' + (finLue && ed.peutAccepter ? '' : ' disabled') + '>' + ed.bouton + ' (version ' + esc(ed.version) + ')</button>'
        + (aide || '<p class="s">' + (ed.information ? 'Ta lecture est gardée' : 'Ton acceptation garde le document') + ', avec sa version, la date et ton identifiant.</p>');
  }
  function lecteurFermer() { var z = $('tc-lecteur'); if (z && !z.hidden) { z.hidden = true; lecteurCle = null; lecteurContrat = false; finLue = false; lecteurCharge = false; $('tc-lect-corps').innerHTML = ''; } }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lecteurFermer(); });

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest && (t.closest('#tc-lect-fermer') || t.closest('#tc-lect-retour'))) { lecteurFermer(); return; }
    /* LIRE : le document s'ouvre dans le lecteur ; la consultation se note quand la fin est atteinte (lecteurFin). */
    var dv = t.closest && t.closest('[data-doc-voir]');
    if (dv) {
      var cleV = dv.getAttribute('data-doc-voir');
      var dd = D.documentsEtat('marchand', s.id).filter(function (x) { return x.cle === cleV; })[0];
      if (dd) lecteurOuvrir({ cle: dd.cle, titre: dd.titre, version: dd.version, url: dd.url });
      return;
    }
    /* LIRE LE CONTRAT-CADRE : signé, le PDF du coffre ; sinon, le texte du modèle — jamais un autre document. */
    var lr = t.closest && t.closest('[data-lire-contrat]');
    if (lr) {
      var mL = D.techMarchand(s.id) || {}, dL = (window.PEC_DOCS && PEC_DOCS.get) ? PEC_DOCS.get('marchand', s.id, 'contrat') : null;
      var oL = { cle: null, contrat: true, titre: TITRE_CONTRAT, version: (dL && dL.empreinte) ? 'empreinte ' + String(dL.empreinte).slice(0, 8) : '' };
      if (dL && dL.data && PEC_DOCS.blob) { try { oL.iframeSrc = URL.createObjectURL(PEC_DOCS.blob(dL)); } catch (eB) {} }
      if (!oL.iframeSrc) oL.html = contratHTML(mL) || '<p>Le coffre n’est pas chargé sur cet écran : le contrat ne peut pas s’afficher ici.</p>';
      lecteurOuvrir(oL); return;
    }
    var dok = t.closest && t.closest('[data-doc-ok]');
    if (dok) {
      if (dok.disabled) return;
      var ed0 = D.documentsEtat('marchand', s.id).filter(function (x) { return x.cle === dok.getAttribute('data-doc-ok'); })[0];
      if (!ed0 || !ed0.peutAccepter) return;
      D.acceptationsPoser('marchand', s.id, [ed0.cle], s.id);
      peindre(); lecteurPied(); return;
    }
    var dgo = t.closest && t.closest('#tc-dossier-go');
    if (dgo) {
      var rs = (window.PEC_DOCS && PEC_DOCS.soumettre) ? PEC_DOCS.soumettre('marchand', s.id, {}) : { ok: false, motif: 'Coffre indisponible.' };
      if (!rs.ok) { var ed1 = $('tc-dossier-err'); if (ed1) { ed1.hidden = false; ed1.textContent = rs.message || rs.motif; } return; }
      peindre(); return;
    }
    /* LA DÉCLARATION « RÉSEAU LIMITÉ », déposée ou corrigée par le data-layer (techConformiteDeposer) : le refus se lit tel quel. */
    var dcl = t.closest && t.closest('#tc-decl-go');
    if (dcl) {
      var rdc = D.techConformiteDeposer({ marchandId: s.id, usageDeclare: $('tc-decl-txt') ? $('tc-decl-txt').value : '' });
      if (!rdc.ok) { var edc = $('tc-decl-err'); if (edc) { edc.hidden = false; edc.textContent = rdc.motif; } return; }
      peindre(); return;
    }
    /* (24/09) LES DEUX RÉPONSES QUI QUALIFIENT LA TVA DES BONS : l'entreprise se ré-enregistre telle quelle avec les réponses — un seul contrôle (techMarchandEntrepriseSet). */
    var tvg = t.closest && t.closest('#tc-tva-go');
    if (tvg) {
      var a0 = D.techMarchand(s.id) || {};
      var rtv = D.techMarchandEntrepriseSet(s.id, { raisonSociale: a0.raisonSociale, siret: a0.siret, siteUrl: a0.siteUrl, sansSite: a0.sansSite, tel: a0.tel, formeJuridique: a0.formeJuridique, adresse: a0.adresse, naf: a0.naf,
        tauxUnique: $('tc-tva-unique') ? $('tc-tva-unique').checked : null, franceSeule: $('tc-tva-france') ? $('tc-tva-france').checked : null }, s.id);
      if (!rtv.ok) { var etv = $('tc-tva-err'); if (etv) { etv.hidden = false; etv.textContent = rtv.motif; } return; }
      peindre(); return;
    }
    /* LE RIB CONTRÔLÉ DU DOSSIER, repris d'un geste : ce sont les mentions relevées par le contrôleur qui s'enregistrent. */
    var rcf = t.closest && t.closest('#tc-rib-coffre');
    if (rcf) {
      var mn = (window.PEC_DOCS && PEC_DOCS.mentions) ? (PEC_DOCS.mentions('marchand', s.id) || {}) : {};
      var rrc = D.techMarchandRibEnregistrer(s.id, { iban: mn.iban, bic: mn.bic, titulaire: mn.titulaire || (D.techMarchand(s.id) || {}).raisonSociale }, s.id);
      if (!rrc.ok) { var erc = $('tc-rib-err0'); if (erc) { erc.hidden = false; erc.textContent = rrc.motif; } return; }
      peindre(); return;
    }
    var cgo = t.closest && t.closest('#tc-contrat-go');
    if (cgo) {
      var m0c = D.techMarchand(s.id);
      var okc = $('tc-contrat-ok');
      var rc = D.techMarchandContratSigner(s.id, { accepte: !!(okc && okc.checked), par: s.id, ctx: { id: s.id, nom: m0c.raisonSociale, siteUrl: m0c.siteUrl } });
      if (!rc.ok) {
        var ec = $('tc-contrat-err'); if (ec) { ec.hidden = false; ec.textContent = rc.motif; }
        var pc0 = $('tc-lect-pied'); if (pc0 && !$('tc-lecteur').hidden) { var ep = pc0.querySelector('.s.refus') || document.createElement('p'); ep.className = 's refus'; ep.style.color = '#8E2A1E'; ep.textContent = rc.motif; pc0.appendChild(ep); }
        return;
      }
      peindre(); lecteurPied(); return;
    }
    /* LE DIRIGEANT — déclaré ou corrigé par le data-layer (techMarchandDirigeantSet) ; le refus nomme le champ. */
    var dch = t.closest && t.closest('#tc-dir-chg, [data-dir-completer]');
    if (dch) { e.preventDefault(); var fd0 = $('tc-dir-form'); if (fd0) { fd0.hidden = false; if ($('tc-dir-chg')) $('tc-dir-chg').hidden = true; $('tc-dir-prenom').focus(); } return; }
    /* LA CIVILITÉ — un choix parmi celles du référentiel, rendu comme un groupe de boutons radio */
    var dcv = t.closest && t.closest('#tc-dir-civilite [data-civ]');
    if (dcv) {
      [].forEach.call(document.querySelectorAll('#tc-dir-civilite [data-civ]'), function (b) { var on = b === dcv; b.setAttribute('aria-checked', String(on)); b.style.background = on ? 'var(--color-primary)' : ''; b.style.color = on ? '#fff' : ''; });
      return;
    }
    var dgo0 = t.closest && t.closest('#tc-dir-go');
    if (dgo0) {
      var civSel = document.querySelector('#tc-dir-civilite [aria-checked="true"]');
      var rd = D.techMarchandDirigeantSet(s.id, { civilite: civSel ? civSel.getAttribute('data-civ') : '', prenom: $('tc-dir-prenom').value, nom: $('tc-dir-nom').value,
        nomNaissance: $('tc-dir-nom-naissance').value, dateNaissance: $('tc-dir-naissance').value, lieuNaissance: $('tc-dir-lieu').value, qualite: $('tc-dir-qualite').value }, s.id);
      if (!rd.ok) {
        var ed2 = $('tc-dir-err'); if (ed2) { ed2.hidden = false; ed2.textContent = rd.motif; }
        var ch2 = { dirigeantPrenom: 'tc-dir-prenom', dirigeantNom: 'tc-dir-nom', dirigeantNaissance: 'tc-dir-naissance', dirigeantLieuNaissance: 'tc-dir-lieu', dirigeantQualite: 'tc-dir-qualite' }[rd.champ];
        var cible = ch2 ? $(ch2) : (rd.champ === 'dirigeantCivilite' ? document.querySelector('#tc-dir-civilite [data-civ]') : null);
        if (cible) cible.focus(); return;
      }
      peindre(); return;
    }
    var mo = t.closest && t.closest('[data-mode]');
    if (mo) {
      var rm = D.techMarchandModeChoisir(s.id, mo.getAttribute('data-mode'), s.id);
      if (!rm.ok) { var ze = $('tc-mode-err'); if (ze) { ze.hidden = false; ze.textContent = rm.motif; } return; }
      peindre(); return;
    }
    var rg0 = t.closest && t.closest('#tc-reseau-go');
    if (rg0) {
      var rs0 = D.techMarchandReseauSet(s.id, $('tc-reseau-k').value, $('tc-reseau-v').value, s.id);
      if (!rs0.ok) { var er0 = $('tc-reseau-err'); if (er0) { er0.hidden = false; er0.textContent = rs0.motif; } return; }
      peindre(); return;
    }
    var rr0 = t.closest && t.closest('[data-reseau-retirer]');
    if (rr0) { D.techMarchandReseauRetirer(s.id, rr0.getAttribute('data-reseau-retirer'), s.id); peindre(); return; }
    var fo2 = t.closest && t.closest('[data-formule]');
    if (fo2) { D.techMarchandFormuleChoisir(s.id, fo2.getAttribute('data-formule'), s.id); peindre(); return; }
    /* (24/09) LA CARTE DE L'ABONNEMENT : le formulaire s'ouvre, puis le data-layer contrôle (Luhn, expiration, titulaire) et ne
       garde que le réseau et les quatre derniers chiffres. Le refus nomme le champ. */
    var cch = t.closest && t.closest('#tc-carte-chg');
    if (cch) { var fc = $('tc-carte-form'); if (fc) { fc.hidden = false; cch.hidden = true; $('tc-carte-num').focus(); } return; }
    var cgo2 = t.closest && t.closest('#tc-carte-go');
    if (cgo2) {
      var ex = String($('tc-carte-exp').value || '').split(/[\/\s-]+/);
      var rcb = D.techMarchandCarteEnregistrer(s.id, { numero: $('tc-carte-num').value, expMois: ex[0], expAnnee: ex[1], titulaire: $('tc-carte-tit').value }, s.id);
      if (!rcb.ok) { var ecb = $('tc-carte-err'); if (ecb) { ecb.hidden = false; ecb.textContent = rcb.motif; } var ccb = { numero: 'tc-carte-num', expiration: 'tc-carte-exp', titulaire: 'tc-carte-tit' }[rcb.champ]; if (ccb && $(ccb)) $(ccb).focus(); return; }
      peindre(); return;
    }
    var sg0 = t.closest && t.closest('#tc-site-go');
    if (sg0) {
      var rs1 = D.techMarchandSiteSet(s.id, { domaine: $('tc-site-dom').value, accroche: $('tc-site-acc').value, couleur: $('tc-site-col').value }, s.id);
      if (!rs1.ok) { var es1 = $('tc-site-err'); if (es1) { es1.hidden = false; es1.textContent = rs1.motif; } return; }
      peindre(); return;
    }
    var rc = t.closest && t.closest('#tc-rib-chg');
    if (rc) { var f0 = $('tc-rib-form'); if (f0) { f0.hidden = false; rc.hidden = true; if (D.ibanSaisie) D.ibanSaisie($('tc-rib-iban')); if (D.bicSaisie) D.bicSaisie($('tc-rib-bic')); } return; }
    var rg = t.closest && t.closest('#tc-rib-go');
    if (rg) {
      var rr = D.techMarchandRibEnregistrer(s.id, { iban: $('tc-rib-iban').value, bic: $('tc-rib-bic').value, titulaire: $('tc-rib-tit').value }, s.id);
      if (!rr.ok) { var er = $('tc-rib-err'); if (er) { er.hidden = false; er.textContent = rr.motif; } return; }
      peindre(); return;
    }
    var cg = t.closest && t.closest('#tc-cle-go');
    if (cg) {
      var b = cg, e1 = $('tc-cle-err'); if (e1) e1.hidden = true;
      b.disabled = true; b.textContent = 'Génération…';
      D.techCleGenerer(s.id, function (r) {
        if (!r.ok) { var e2 = $('tc-cle-err'); if (e2) { e2.hidden = false; e2.textContent = r.motif; } peindre(); return; }
        secretVu = r.secret;   /* montré une fois, et seulement ici */
        peindre();
      });
      return;
    }
    /* (23/09) plus de révocation de mandat de représentation : il n'y a plus de mandat. */
  });
  /* SE DÉCONNECTER ferme les deux clés : l'espace de la marque ET la session de son compte (sans toucher à celle d'un
     autre espace ouvert sur l'appareil — une session de Mes bons, par exemple, reste ouverte). */
  $('tc-out').addEventListener('click', function (e) {
    e.preventDefault(); T.deconnecter('marchand');
    var ss = D.session(); if (ss && ss.espace === D.ESPACES_COMPTE.marque.sessionLabel) D.deconnecter();
    location.href = '01-connexion.html';
  });

  peindre();
  window.addEventListener('pec-bus', peindre);
  window.addEventListener('storage', function (e) { if (!e.key || /^pec/.test(e.key)) peindre(); });
})();
</script>
