<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PayEnCash SOLUTION — Mon accès</title>
<link rel="icon" type="image/png" sizes="64x64" href="../assets/logos/payencash-solution-blanc-64.png">
<link rel="apple-touch-icon" href="../assets/logos/payencash-solution-blanc-180.png">
<link rel="stylesheet" href="../assets/payencash-v2.css">
<link rel="stylesheet" href="../assets/payencash-tech.css">
<link rel="stylesheet" href="../assets/payencash-inscription.css"><!-- le bouton « Afficher » des mots de passe -->
<script src="../assets/payencash-icons.js"></script>
<script src="../assets/payencash-data.js"></script>
<script src="../assets/payencash-bus.js"></script>
<script src="../assets/payencash-docs.js"></script>
<script src="../assets/payencash-tech.js"></script>
<script src="../assets/payencash-inscription.js"></script>
<script src="../assets/payencash-equipe.js"></script>
<!-- MON ACCÈS — l'écran du COLLABORATEUR d'une marque (24/09, nuit). Pour qui il travaille, son identifiant, son mot de passe à changer,
     et la porte pour sortir : c'est tout (PEC_EQUIPE.monAcces, le même que dans l'app des commerces). Se déconnecter ferme SA session
     de collaborateur et la session de son compte — pas celle d'un autre espace ouvert sur l'appareil. -->
<script src="../assets/payencash-coque.js"></script>
</head>
<body>
<div class="pec-scene">
<div class="pec-device pec-etroit">

  <div class="pec-statusbar">
    <span class="pec-sb-time">9:41</span>
    <span class="pec-sb-icons"><svg class="pec-ico" viewBox="0 0 24 24"><use href="#i-signal"/></svg></span>
  </div>

  <div class="pec-tech-entete" id="tk-entete"></div>

  <div class="pec-body pec-body--scroll">
    <div id="tk-hero"></div>
    <div class="pec-info-body">
      <div class="pec-card" id="ma-garde" hidden style="padding:14px 15px">
        <div style="font-weight:800;font-size:14px">Cet espace est celui d’un collaborateur</div>
        <p style="margin:6px 0 0;font-size:12.5px;line-height:1.55;color:var(--color-muted)" id="ma-garde-txt">Connecte-toi avec l’identifiant que ta marque t’a envoyé.</p>
        <a class="pec-cta tap" href="01-connexion.html" style="display:block;text-align:center;margin-top:11px" id="ma-garde-go">Aller à la connexion</a>
      </div>
      <div id="ma-acces"></div>
    </div>
  </div>

  <nav id="tk-menu"></nav>
</div>
</div>
<script>
(function () {
  'use strict';
  var D = window.PEC_DATA, T = window.PEC_TECH, $ = function (i) { return document.getElementById(i); };
  var k = T ? T.collab() : null;
  if (T) { T.entete('tk-entete'); T.menu('tk-menu', '14-mon-acces.html');
    T.hero('tk-hero', { teinte: 'compte', titre: 'Mon accès', promesse: k ? 'Ton accès ' + D.terme('collaborateur') + ' de ' + k.marque.raisonSociale + ' : ton identifiant, ton mot de passe.' : 'Ton identifiant, ton mot de passe.' }); }
  if (!D || !T || !window.PEC_EQUIPE) return;
  if (!k) {
    $('ma-garde').hidden = false;
    if (T.session('marchand')) { $('ma-garde-txt').textContent = 'Tu es connectée en tant que marque : ton compte se règle dans « Compte ».'; $('ma-garde-go').href = '10-compte.html'; $('ma-garde-go').textContent = 'Aller à mon compte'; }
    return;
  }
  PEC_EQUIPE.monAcces('ma-acces', { compte: k.compte, onSortir: function () {
    T.deconnecter('collaborateur');
    var ss = D.session(); if (ss && String(ss.identifiant || '').toLowerCase() === String(k.compte.identifiant).toLowerCase()) D.deconnecter();
    location.href = '01-connexion.html';
  } });
})();
</script>
</body>
</html>
