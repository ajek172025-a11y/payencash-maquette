<!--
  LES MARQUES DU RÉSEAU (23/09 — le grossiste ; fondatrice : « l'app PayEnCash Solution s'adresse aux marques ; nos
  partenaires ont leur propre app » · « app partenaire : logique sédentaire, logique réseau nomade, plus de clarté
  juridique »).
  CE QUE CET ÉCRAN DIT : quelles marques vendent leurs bons dans le réseau (techMarchands validées, prêtes à travailler —
  techMarchandPeutTravailler), à quelle offre (techMarchandMode : ce que le point garde sur chaque bon), et où en est leur
  forfait d'édition (techQuota : un forfait épuisé ferme la vente de CETTE marque jusqu'au mois suivant). Le comptoir, lui,
  est sur « Vendre » (03) : un lien y mène avec la marque déjà choisie.
  L'ORDRE DE VENTE — le flashcode qu'un client présente (techOrdreVenteUrl mène ici, ?vendre=<slug>) — OUVRE LE COMPTOIR :
  cette page le fait suivre à 03-vendre avec sa référence, elle ne vend pas elle-même. Un client qui n'a pas de flashcode
  peut dicter la référence de son bon proposé : le champ ci-dessous l'accepte, ou l'adresse entière.
  LES MISES EN RELATION — pour le DISTRIBUTEUR NOMADE seulement (24/09, nuit — « beaucoup de doublons ») : elles se traitent sur
  l'ACCUEIL, une seule fois (appeler, valider, servir, décliner) ; cette page n'en garde qu'un renvoi, avec leur nombre. Un
  commerce ne se déplace pas.
  DEUX QUALIFICATIONS JURIDIQUES, ET CE NE SONT PAS DEUX VARIANTES D'AFFICHAGE :
    ① le POINT PHYSIQUE (sédentaire) est REVENDEUR POUR SON PROPRE COMPTE : il nous achète le bon au moment où il le vend,
       à la valeur faciale diminuée de sa part, et le revend au prix qu'il affiche (la valeur faciale est le prix conseillé)
       — ce qu'il nous doit est une créance commerciale ordinaire, prélevée après l'arrêté du soir ; sa marge est la sienne,
       et elle figure sur son autofacture mensuelle ;
    ② le DISTRIBUTEUR NOMADE est COMMISSIONNAIRE (art. L132-1 C. com.) : il vend pour le compte de PayEnCash, en exécution
       d'un contrat de commission écrit et préalable, et il paie d'avance la valeur des bons à revendre (le paiement anticipé
       s'impute, sans intérêt, sur chaque bon édité ; le solde non imputé lui revient à la fin du contrat) ; sa rémunération
       est une COMMISSION, seul chiffre d'affaires qu'il déclare ; il ne détient jamais de fonds d'autrui.
  (24/09, soir — relecture juridique) plus un mot du mandat pour le nomade, plus aucune citation des art. 1999 et 1993 du
  code civil : il ne fait pas d'avance de fonds qu'on lui rembourserait, il paie d'avance ce qu'il revend. Les articles cités
  à l'écran sont LUS au référentiel (techRef().seuils, glossaire ref.parties) : aucun n'est écrit ici.
  (24/09, soir — fondatrice : « le design n'a pas été repris ») LE BUREAU : un principal et un panneau. À gauche, les marques
  en grille de cartes (nom, site, offre de paiement, ta part, « Vendre ») puis le cadre juridique ; dans le panneau, ce qui se
  fait au comptoir — le bon proposé qu'un client présente (le champ et « Ouvrir » sur une ligne) et, pour le nomade, ses
  rencontres. Sur téléphone, le panneau passe en tête et la liste des marques redevient une carte à lignes : l'ordre et le
  rendu d'avant.
  TOUT EST DÉRIVÉ : taux, délais, plafonds, garantie, articles de loi viennent du data-layer ; rien n'est écrit ici.
-->

</style>

<script>
(function () {
  'use strict';
  var D = window.PEC_DATA, P = window.PEC_PART, $ = function (i) { return document.getElementById(i); };
  if (!D || !P || !D.techRef) return;
  var esc = function (v) { return D.esc(v); };
  var pc = function (x) { return String(x).replace('.', ',') + ' %'; };

  /* L'ORDRE DE VENTE MÈNE AU COMPTOIR. Le flashcode d'un bon proposé (techOrdreVenteUrl) arrive sur cette page avec son
     slug : c'est « Vendre » qui le sert — la marque et le montant y sont posés et verrouillés. On le fait suivre tel quel,
     sans rien relire ici : un même ordre lu à deux endroits finirait par être lu de deux façons. */
  var slug0 = (new URLSearchParams(location.search)).get('vendre');
  if (slug0) { location.replace('03-vendre.html?vendre=' + encodeURIComponent(slug0)); return; }

  /* Ce qui survit au repeint du bus : le refus qu'on vient de lire sous la référence dictée. */
  var ordreErreur = null;

  /* (24/09, soir) une section = un titre et une carte ; la marge intérieure n'est posée que sur téléphone (.mq-carte) —
     sur bureau, la feuille partagée donne la sienne */
  function carte(titre, corps) {
    return '<p class="pec-section-label mq-sec">' + titre + '</p><div class="pec-card mq-carte">' + corps + '</div>';
  }
  function pill(t, cls) { return '<span class="pec-pill mq-pill ' + cls + '">' + esc(t) + '</span>'; }
  /* LA RÉFÉRENCE D'UN ARTICLE DE LOI — sortie de la phrase de fondement du référentiel (refArticle), le texte entier en
     infobulle : le jour où l'avocat fait bouger un mot, il bouge au référentiel et cet écran suit. */
  function art(src) {
    if (!src) return '';
    var court = String(D.refArticle ? D.refArticle(src) : src).split(' (')[0].trim();
    return '<span class="art" title="' + esc(src) + '">' + esc(court) + '</span>';
  }

  /* UNE RENCONTRE, TELLE QUE LE DISTRIBUTEUR NOMADE LA LIT : avant de la prendre, la commune, le montant, la rue — le numéro
     et l'étage ne se découvrent qu'en acceptant (règle du data-layer). Prise : le client à appeler, le canal qu'il préfère,
     la porte du comptoir pour la servir, et « je ne peux pas y aller ». */
  /* UNE MARQUE, UNE CARTE (24/09, soir) — son nom, son site, son offre de paiement, TA part et le geste : sur bureau, une carte
     de la grille (la part en grand, « Vendre » au pied) ; sur téléphone, la même carte redevient une ligne de la liste. Validée
     et prête (documents acceptés, contrat-cadre signé, déclaration validée), elle se vend ; sinon l'écran dit ce qui la ferme. */
  function marqueCarte(m, nomade, R) {
    var prete = D.techMarchandPeutTravailler(m.id).ok, mo = D.techMarchandMode(m), q = D.techQuota(m.id) || {};
    var epuise = !!(q.reste != null && q.reste <= 0), seuil = !!q.seuilAtteint, site = String(m.siteUrl || '').replace(/^https?:\/\//, '');
    /* (24/09, nuit) deux cas à ne pas confondre : une marque qui n'a jamais vendu (inscription pas terminée → « Bientôt ») et une
       marque déjà ouverte que ferme une mise à jour (nouvelle version d'un document à relire → « Fermée », momentanément) */
    var ouverteAvant = m.statut === 'validated' && !!m.contratSigneLe;
    var alerte = !prete ? (ouverteAvant ? 'Momentanément fermée à la vente — la marque met à jour ses documents chez ' + esc(R.nom) + '.' : 'Pas encore prête à vendre — son inscription chez ' + esc(R.nom) + ' n’est pas terminée.')
      : seuil ? 'Seuil légal atteint : aucun bon ne s’émet avant sa déclaration à l’ACPR.'
      : epuise ? 'Forfait du mois épuisé (' + esc(String(q.max)) + ' bons) : la vente reprend le mois prochain, ou sur un forfait supérieur.' : '';
    return '<div class="mq-m"><div class="mq-m-tx"><div class="nm">' + esc(m.raisonSociale) + '</div>'
      + '<span class="sb">' + [site ? esc(site) : '', 'offre « ' + esc(mo.libelle) + ' » : sur 100 € de bons, tu ' + (nomade ? 'perçois ' : 'gardes ') + esc(D.eur(mo.partPointPct))].filter(Boolean).join(' · ') + '</span>'
      + (alerte ? '<span class="sb mq-alerte">' + alerte + '</span>' : '')
      + '</div><div class="mq-m-pied"><span class="mq-part"><b>' + esc(pc(mo.partPointPct)) + '</b>' + (nomade ? 'ta commission' : 'ta part') + '</span>'
      + (prete && !epuise && !seuil ? '<a class="pec-pill tap mq-geste" href="03-vendre.html?marque=' + encodeURIComponent(m.id) + '">Vendre</a>' : pill(prete || ouverteAvant ? 'Fermée' : 'Bientôt', 'pec-pill--off'))
      + '</div></div>';
  }

  /* LE SLUG D'UN ORDRE DE VENTE, dicté ou collé : la référence seule, ou l'adresse entière du flashcode (?vendre=) ou de la
     page partagée (?l=). On n'en relit rien de plus : « Vendre » lit l'ordre lui-même. */
  function slugDe(saisie) {
    var s = String(saisie || '').trim(); if (!s) return '';
    var m = /[?&](?:vendre|l)=([^&#\s]+)/.exec(s);
    return decodeURIComponent(m ? m[1] : s.replace(/^.*\//, ''));
  }

  function peindre() {
    var pt = P.point(), R = D.techRef(), r = P.revendeur(), nomade = P.nomade();
    /* (24/09, soir — relecture juridique) le nomade vend en exécution de son contrat de commission et paie d'avance la valeur des
       bons ; le commerce revend au prix qu'il affiche, la valeur faciale n'étant que le prix conseillé */
    $('mq-sous').textContent = nomade
      ? 'Tu vends les bons de ces marques pour le compte de ' + R.nom + ', en exécution de ton contrat de commission : tu paies d’avance la valeur des bons à revendre, et ta commission est ta part sur chaque bon.'
      : 'Tu achètes les bons de ces marques à ' + R.nom + ' au moment où tu les vends, et tu les revends au prix que tu affiches — la valeur faciale est le prix conseillé. Ce que tu nous dois est prélevé après l’arrêté de ' + R.paiement.arreteHeure + '.';
    if (!pt) {
      $('mq-corps').innerHTML = carte('Le réseau', '<p class="vide">Aucun point rattaché à cette session : connecte-toi avec l’identifiant de ton commerce.</p>');
      return;
    }
    /* la référence qu'on était en train de taper survit au repeint (le bus repeint la page à chaque geste, ailleurs compris) */
    var saisie = $('mq-ordre'), gardee = saisie ? saisie.value : '', focus = !!(saisie && document.activeElement === saisie);

    /* ① LE PANNEAU — ce qui se fait au comptoir : l'ordre de vente dicté, puis (nomade) les rencontres */
    /* (24/09, nuit — fondatrice : « si le scan n'est pas reconnu, la réf du bon à acheter ») LA RÉFÉRENCE est écrite sous chaque
       flashcode (OV-…) : elle se tape ici, avec ou sans son préfixe, et ouvre le même ordre de vente que le scan */
    var exRef = String(R.prefixeOrdre || '') + 'ABCDEFGHJK'.slice(0, +R.refOrdreLongueur || 6);
    var panneau = carte('Un client te présente un bon proposé ?', '<p class="mq-aide">Scanne son flashcode — il ouvre le comptoir avec la marque et le montant. Si le scan ne passe pas, saisis la <b>référence écrite sous le flashcode</b> (' + esc(exRef) + '), ou colle l’adresse.</p>'
      + '<div class="mq-ordre-l"><input class="pec-input" id="mq-ordre" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="' + esc(exRef) + '" aria-label="Référence du bon à acheter, écrite sous le flashcode"><button type="button" class="pec-cta pec-cta--tight tap" id="mq-ordre-go">Ouvrir</button></div>'
      + (ordreErreur ? '<p class="err">' + esc(ordreErreur) + '</p>' : ''));
    if (nomade && r) {
      /* LES MISES EN RELATION SE TRAITENT SUR L'ACCUEIL — ici, leur nombre et le chemin */
      var rl = D.techRencontresRevendeur(r.id).filter(function (x) { return x.statut === 'demandee' || x.statut === 'acceptee'; });
      panneau += carte('Tes mises en relation', '<p class="mq-aide">' + (rl.length
        ? '<b>' + rl.length + ' demande' + (rl.length > 1 ? 's' : '') + ' en cours</b> : appelle, valide le rendez-vous, puis sers le bon depuis « Vendre ».'
        : 'Aucune demande en cours. Un client te choisit sur la carte de Mes bons, ou depuis la page d’un bon proposé : tu es prévenu, tu l’appelles, tu valides.')
        + '</p><a class="pec-cta pec-cta--tight tap" href="02-accueil.html#pb-rdv" style="margin-top:10px">Voir sur l’accueil</a>');
    }

    /* ② LES MARQUES — validées ; celles qui ne sont pas prêtes sont dites « Bientôt », elles ne s'ouvrent pas */
    var toutes = D.techMarchands({ statut: 'validated' }).sort(function (a, b) { return String(a.raisonSociale).localeCompare(String(b.raisonSociale), 'fr'); });
    var principal = toutes.length
      ? '<p class="pec-section-label mq-sec">Les marques dont tu vends les bons</p><div class="mq-marques pec-grille-cartes">' + toutes.map(function (m) { return marqueCarte(m, nomade, R); }).join('') + '</div>'
      : carte('Les marques dont tu vends les bons', '<p class="vide">Aucune marque n’a encore rejoint le réseau. Dès qu’une marque est vérifiée par ' + esc(R.nom) + ', ses bons se vendent ici — tu n’as rien à faire.</p>');

    /* ③ LE CADRE — ce qu'il est, en droit, et ce que ça change */
    principal += carte('Ce que je suis, en droit', blocDroit(nomade, R));

    $('mq-corps').innerHTML = '<div class="pec-cols pec-cols--principal mq-cols"><div class="pec-colonne">' + principal + '</div>'
      + '<aside class="pec-colonne pec-avant-mobile">' + panneau + '</aside></div>';
    if (gardee || focus) { var s2 = $('mq-ordre'); if (s2) { s2.value = gardee; if (focus) s2.focus(); } }
  }

  /* LE CADRE JURIDIQUE, DIT AVEC PRÉCISION — c'est ce qui distingue les deux modes d'exercice, et c'est ce qu'un contrôle
     regarde. Les articles viennent du référentiel (glossaire ref.parties pour le commissionnaire, techRef().seuils pour le
     réseau limité et les espèces) ; rien n'est paraphrasé au point de perdre son sens.
     (24/09, soir — relecture juridique) le nomade : un contrat de commission écrit et préalable, un paiement d'avance qui
     s'impute sur chaque bon édité — plus d'« avance de fonds » remboursée, plus d'art. 1999 ni 1993 du code civil ; le
     commerce : le prix qu'il affiche (la valeur faciale est le prix conseillé), sa marge sur son autofacture mensuelle. */
  function blocDroit(nomade, R) {
    var S = R.seuils || {};
    if (nomade) {
      var jur = /\((art\.[^)]*)\)/.exec(D.terme('nomade', 'juridique') || '');
      return '<div class="droit"><b>Tu es commissionnaire</b> : tu vends en ton nom, mais <b>pour le compte</b> de ' + esc(R.nom) + ', en exécution d’un contrat de commission écrit et préalable' + (jur ? ' (' + art(jur[1]) + ')' : '') + '.'
        + '<br><br>· <b>Tu paies d’avance la valeur des bons à revendre</b> : ce paiement anticipé s’impute, sans intérêt, sur chaque bon édité, et le solde non imputé te revient à la fin du contrat. Tu ne détiens <b>jamais</b> les fonds d’autrui.'
        + '<br>· <b>Ta rémunération est une commission</b> : ta part sur chaque bon vendu, selon l’offre de la marque. C’est elle, et elle seule, qui constitue ton chiffre d’affaires — pas la valeur des bons.'
        + '<br>· <b>Tu ne supportes aucun risque de mévente</b> : un bon n’est édité qu’à la vente, au montant demandé.'
        + '<br>· <b>Tu rends compte</b> de chaque vente : l’application le fait pour toi, opération par opération.'
        + '<br>· <b>Ta garantie est un dépôt</b>, restitué intégralement à ton départ — jamais une sanction.'
        + '<br><br><b>Tu restes indépendant :</b> tu acceptes ou refuses ce que tu veux, tu travailles pour qui tu veux, et personne ici ne te donne d’ordre.</div>';
    }
    return '<div class="droit"><b>Tu es revendeur pour ton propre compte.</b> Tu achètes le bon au moment où tu le vends, à la valeur faciale diminuée de ta part, et tu le revends à ton client au prix que tu affiches — la valeur faciale est le prix conseillé.'
      + '<br><br>· <b>Ce que tu nous dois est une créance commerciale ordinaire</b>, réglée par prélèvement SEPA après l’arrêté de ' + esc(R.paiement.arreteHeure) + ' — pas un encaissement pour notre compte.'
      + '<br>· <b>Ta marge t’appartient</b> : nous n’y prélevons rien ; elle figure sur ton autofacture mensuelle (TVA selon le régime du bon).'
      + '<br>· <b>Le bon ne vaut que chez la marque qui l’a émis</b>' + (S.reseauLimiteSource ? ' (' + art(S.reseauLimiteSource) + ', exclusion « réseau limité »)' : '') + ' : les réseaux ne se mélangent jamais.'
      + '<br>· <b>Comment ton client te règle ne nous regarde pas</b> : c’est une vente de ton commerce à ton client. Seul le plafond légal des espèces s’impose à toi' + (S.especesSource ? ' (' + art(S.especesSource) + ')' : '') + '.</div>';
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('#mq-ordre-go') : null;
    if (!el) return;
    var r = P.revendeur();
    if (el.id === 'mq-ordre-go') {
      var s = slugDe(($('mq-ordre') || {}).value);
      ordreErreur = null;
      if (!s) { ordreErreur = 'Saisis la référence écrite sous le flashcode, ou colle son adresse.'; peindreEtGarder(); return; }
      var ovS = D.techOrdreVente(s);
      if (!ovS) { ordreErreur = 'Aucun bon proposé ne porte cette référence sur cet appareil — vérifie celle écrite sous le flashcode.'; peindreEtGarder(); return; }
      location.href = '03-vendre.html?vendre=' + encodeURIComponent(ovS.slug); return;   // la référence saisie mène au même ordre que le scan
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'mq-ordre') { var b = $('mq-ordre-go'); if (b) b.click(); } });

  /* LA GARDE DU SOCLE — un point suspendu, en intégration ou sans session lit le bandeau ; le corps est refait à chaque
     peinture, la garde se rappelle après (elle ne s'empile pas). */
  function garder() { P.garde({ desactiver: ['mq-ordre-go'] }); }
  function peindreEtGarder() { peindre(); garder(); }

  peindreEtGarder();
  window.addEventListener('pec-bus', peindreEtGarder);
  window.addEventListener('storage', function (e) { if (!e.key || /^pec/.test(e.key)) peindreEtGarder(); });
})();
</script>
