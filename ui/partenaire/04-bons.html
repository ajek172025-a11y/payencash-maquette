<!-- LES BONS DE MARQUE VENDUS PAR CE POINT (23/09 — le grossiste). POURQUOI : chaque bon émis au comptoir (techBons, filtré sur
     la fiche de vente du point) vit ici avec son ÉTAT (techBonEtatLbl : acheté par le réseau, remis au client, utilisé chez la
     marque, annulé — dérivé, jamais écrit), la marque, ce que le point nous doit dessus (la vente qui l'a fait naître :
     prixPoint, et où en est son prélèvement — techVenteStatutLbl), et deux gestes :
       · Réimprimer — le même ticket que la vente (techBonTicketHTML, une source) avec son flashcode ;
       · Annuler — un bon émis par erreur : dans ref.tech.annulationMinutes, non utilisé, vente pas encore partie au prélèvement ;
         motif obligatoire ; le data-layer (techBonAnnuler) tranche et son refus s'affiche tel quel. Une vente payée d'avance
         recrédite l'avance du distributeur nomade ; une vente à prélever s'annule avec le bon.
     CE QU'IL NOUS DOIT — en tête : l'encours du point (techEncours : vendu, pas encore réglé, et le plafond), et pour chaque
     offre de marque en attente, l'arrêté qui l'emportera (techArrete). Un distributeur nomade lit son solde d'avance à la place.
     Kit de listes : recherche (data-fsearch), tri par en-tête (data-fsortable), 10 par page (data-fpage), état vide (data-fvide).
     (24/09, soir — fondatrice : « le design n'a pas été repris ») LE BUREAU : le cadre prend la grande largeur (pec-large) pour le
     tableau ; en tête, les nombres du mois à gauche et « Ce que je dois » dans un panneau à droite ; la recherche, le tableau et
     ses gestes à l'échelle de lecture d'un écran (lignes de 14 à 15 px). Sur téléphone, rien ne change : même ordre, mêmes
     tailles, mêmes marges. -->
<style>

<body>
<div class="pec-scene">
<div class="pec-device pec-large"><!-- (24/09, soir) pec-large : le tableau des bons prend la grande largeur de bureau -->

  <div class="pec-statusbar">
    <span class="pec-sb-time">9:41</span>
    <span class="pec-sb-icons"><svg class="pec-ico" viewBox="0 0 24 24"><use href="#i-signal"/></svg></span>
  </div>

  <div class="pec-body pec-body--scroll">
    <div class="pec-info-body" style="padding-top:14px">

      <!-- (24/09, soir) L'EN-TÊTE DE PAGE : le titre, le point et le délai d'annulation (lu au référentiel) -->
      <div class="pec-page-tete bl-tete">
        <div class="tx">
          <h1 id="bl-titre">Bons vendus</h1>
          <p class="sous"><span id="bl-enseigne">—</span> · l’état de chaque bon de marque, réimpression, annulation au comptoir <span id="bl-delai">—</span></p>
        </div>
      </div>

      <!-- GARDE (socle) : un point suspendu ou clos garde ses bons À VOIR (les clients les utilisent encore) ; seule la vente est fermée -->
      <div id="pt-garde" class="pt-garde" hidden><b id="pt-garde-titre">—</b><div id="pt-garde-txt" class="s">—</div></div>

      <!-- (24/09, soir) SUR BUREAU, LES NOMBRES DU MOIS À GAUCHE ET CE QUE JE DOIS DANS UN PANNEAU À DROITE ; sur téléphone, l'un
           sous l'autre, dans l'ordre d'avant -->
      <div class="pec-cols pec-cols--principal bl-haut">
        <div class="pec-colonne">
          <!-- Compteurs du mois — dérivés des ventes vives (techVentes du mois courant) -->
          <div class="bl-kpi">
            <div class="pec-card"><div class="l">Vendus ce mois</div><div class="v" id="bl-nb">0</div></div>
            <div class="pec-card"><div class="l">Valeur ce mois</div><div class="v" id="bl-eur">0 €</div></div>
            <div class="pec-card"><div class="l">Annulés ce mois</div><div class="v" id="bl-annules">0</div></div>
          </div>
        </div>
        <div class="pec-colonne">
          <!-- CE QUE JE DOIS — l'encours et les arrêtés à venir (sédentaire) ou le solde d'avance (nomade) -->

        </div>

      <div class="bl-msg" id="bl-msg" role="status" hidden></div>

      <!-- (24/09, nuit) LE TITULAIRE VOIT TOUT, ET PAR QUI : le filtre « Vendu par » (lui, puis chacun de ses collaborateurs) ; le
           collaborateur ne voit que ses bons — la liste lui est filtrée à la source (techBons par vendeur), pas masquée à l'écran -->
      <div class="bl-filtres">
        <input class="pec-input bl-recherche" type="search" data-fsearch="#bl-rows > tr" placeholder="Code, marque, montant, date…" aria-label="Rechercher un bon">
        <select class="pec-input bl-vendeur" id="bl-vendeur" aria-label="Vendu par" hidden></select>
      </div>
      <div class="meta" data-fvide="#bl-rows > tr" data-fvide-txt="Aucun bon ne correspond à « %q »." style="display:none;padding:10px 0 0"></div>

          <tbody id="bl-rows" data-fpage="10"></tbody>

      <!-- RÉIMPRESSION — le même ticket (techBonTicketHTML) avec son flashcode, imprimable -->

        <button type="button" class="pec-cta pec-cta--tight tap bl-imprimer" id="bl-ticket-imprimer">Imprimer le ticket</button>

        <b class="bl-panel-t" id="bl-motif-titre">Annuler le bon</b>
        <p class="meta bl-motif-p" id="bl-motif-txt">—</p>
        <textarea class="pec-input" id="bl-motif-txt-in" rows="2" placeholder="Motif obligatoire (erreur de montant, client reparti sans payer…)"></textarea>
        <div class="bl-motif-btns">
          <button type="button" class="pec-cta pec-cta--tight tap" id="bl-motif-ok">Annuler ce bon</button>
          <button type="button" class="pec-btn-secondary tap" id="bl-motif-non">Garder</button>
        </div>

      <p class="meta bl-note" id="bl-note">—</p>

    </div>

  <nav class="pec-tabbar" aria-label="Navigation principale" data-app="PayEnCash Partenaire" data-part-menu="04-bons.html"></nav><!-- (24/09, nuit) la barre se pose depuis PEC_PART.menu : écrite une fois, celle du titulaire ou du collaborateur -->

</div>

<script>
  (function () {
    var D = window.PEC_DATA, P = window.PEC_PART; if (!D || !P || !D.techBons) return;
    function $(id) { return document.getElementById(id); }
    function esc(v) { return D.esc(v); }
    function pad(n) { return String(n).padStart(2, '0'); }
    /* LE CODE NE S'ÉCRIT EN ENTIER QUE SUR LE TICKET : à l'écran, les groupes du milieu sont voilés — le même masque que la
       page du bon proposé. */
    function masque(code) { return String(code || '').replace(/-[A-Z0-9]{4}(?=-)/g, '-••••'); }
    var derniereEmpreinte = null, aAnnuler = null;

    // GARDE (socle) : bandeau seulement — la liste reste lisible quel que soit l'état du point
    P.garde({ desactiver: [] });

    function message(txt, ok) { var m = $('bl-msg'); m.hidden = !txt; m.textContent = txt || ''; m.className = 'bl-msg ' + (ok ? 'ok' : 'ko'); }
    /* (24/09, nuit) LES BONS À LIRE : ceux du point pour le titulaire (tous, ou ceux d'un vendeur choisi), les SIENS pour un
       collaborateur — le filtre part de la vente qui a fait naître le bon (techBons par vendeur) */
    function filtreVendeur() { var k = P.collab(); if (k) return k.identifiant; var s = $('bl-vendeur'); return (s && s.value) || null; }
    function bonsDuPoint() { var r = P.revendeur(); if (!r) return []; var q = { revendeurId: r.id }, v = filtreVendeur(); if (v) q.par = v; return D.techBons(q); }
    function peindreVendeurs() {
      var s = $('bl-vendeur'), p = P.point(), k = P.collab(); if (!s) return;
      var l = (!k && p && D.collaborateurs) ? D.collaborateurs('point', p.id) : [];
      s.hidden = !l.length;
      if (!l.length) { s.innerHTML = ''; return; }
      var cur = s.value, moi = (P.compteSession() || {}).identifiant || '';
      var opts = [{ v: '', t: 'Tous les vendeurs' }, { v: moi, t: 'Toi (titulaire)' }].concat(l.map(function (x) { return { v: x.identifiant, t: x.nomAffiche + (x.statut === 'clos' ? ' (accès retiré)' : '') }; }));
      var sig = opts.map(function (o) { return o.v + '=' + o.t; }).join('|');
      if (s.getAttribute('data-sig') !== sig) { s.setAttribute('data-sig', sig); s.innerHTML = opts.map(function (o) { return '<option value="' + esc(o.v) + '">' + esc(o.t) + '</option>'; }).join(''); }
      if (opts.some(function (o) { return o.v === cur; })) s.value = cur;
    }
    function trouver(code) { return bonsDuPoint().filter(function (b) { return b.code === code; })[0] || null; }
    /* ANNULABLE ICI ? — la même règle que techBonAnnuler (non utilisé, dans le délai, vente pas partie au prélèvement) : le
       bouton ne s'offre que quand le geste peut aboutir ; le data-layer reste seul juge au clic. */
    function annulable(b, R) {
      if (b.etat === 'cancelled' || b.etat === 'redeemed' || b.solde < b.montant) return false;
      if ((Date.now() - (b.emisLe || 0)) >= R.annulationMinutes * 60000) return false;
      var v = b.venteRef ? D.techVente(b.venteRef) : null;
      if (v && v.paiement !== 'avance' && v.statut !== 'a_prelever') return false;
      return true;
    }
    function resteMin(b, R) { return Math.max(0, Math.ceil((R.annulationMinutes * 60000 - (Date.now() - (b.emisLe || 0))) / 60000)); }
    function pillEtat(b) {
      var cls = b.etat === 'cancelled' ? 'pec-pill--off' : (b.etat === 'redeemed' ? 'pec-pill--done' : (b.etat === 'sold' ? 'pec-pill--live' : 'pec-pill--wait'));
      return '<span class="pec-pill ' + cls + '">' + esc(D.techBonEtatLbl(b.etat)) + '</span>';
    }

    /* CE QUE JE DOIS — sédentaire : l'encours (techEncours) et, par offre de marque en attente, l'arrêté qui emportera ces
       ventes (techArrete : la fin de fenêtre, l'échéance du prélèvement). Nomade : son solde d'avance et sa garantie. */
    function pl(n, mot) { return n + ' ' + mot + (n > 1 ? 's' : ''); }
    function rendreDu() {
      var z = $('bl-du'), r = P.revendeur(), R = D.techRef();
      if (!r) { z.innerHTML = '<div class="meta" style="padding:6px 0">Aucune fiche de vente rattachée à cette session.</div>'; return; }
      if (D.techPaieParAvance(r)) {
        var av = D.avanceSolde('revendeur', r.id);
        $('bl-du-titre').textContent = 'Mon avance';
        z.innerHTML = '<div class="r"><span class="l">Avance disponible pour de nouveaux bons</span><span class="v"' + (av.bas ? ' style="color:var(--color-amber-text)"' : '') + '>' + esc(D.eur(av.solde)) + '</span></div>'
          + '<div class="r"><span class="l">Garantie versée (dépôt, restitué à ton départ)</span><span class="v">' + esc(D.eur(av.garantie)) + (av.garantieVersee ? '' : ' / ' + esc(D.eur(av.garantieDue))) + '</span></div>'
          + '<div class="r"><span class="l">Chaque bon vendu débite ton avance de son prix réseau : rien ne reste dû.</span><span class="v"><a href="05-releves.html" class="pec-tap-confort" style="color:var(--color-primary-dark)">Mouvements ›</a></span></div>';
        return;
      }
      $('bl-du-titre').textContent = 'Ce que je dois';
      var enc = D.techEncours(r.id);
      var attente = D.techVentes({ revendeurId: r.id, statut: 'a_prelever' }), parMode = {};
      attente.forEach(function (v) { var g = parMode[v.modeId] || (parMode[v.modeId] = { n: 0, montant: 0 }); g.n++; g.montant = Math.round((g.montant + v.prixPoint) * 100) / 100; });
      /* (24/09, soir) chaque ligne dit ce que porte son chiffre : le nombre de bons va avec l'encours, le reste avec le plafond */
      var h = '<div class="r tot"><span class="l">Encours — ' + pl(enc.ventes, 'bon') + ' vendu' + (enc.ventes > 1 ? 's' : '') + ', pas encore réglé' + (enc.ventes > 1 ? 's' : '') + '</span><span class="v">' + esc(D.eur(enc.montant)) + '</span></div>'
        + '<div class="r"><span class="l">Ventes encore possibles sous ton plafond d’encours de ' + esc(D.eur(enc.plafond)) + (enc.depasse ? ' — <b style="color:var(--color-amber-text)">dépassé</b>' : '') + '</span><span class="v">' + esc(D.eur(Math.max(0, enc.reste))) + '</span></div>';
      Object.keys(parMode).forEach(function (mid) {
        var a = D.techArrete(mid), g = parMode[mid];
        h += '<div class="r"><span class="l">Offre « ' + esc(a.mode.libelle) + ' » — ' + g.n + ' bon' + (g.n > 1 ? 's' : '') + ' : arrêté ' + (a.du ? 'dû, prélèvement à préparer' : 'le ' + esc(D.dateHeure(a.prochaineFin))) + ', échéance ' + esc(D.dateHeure(a.echeance)) + '</span><span class="v">' + esc(D.eur(g.montant)) + '</span></div>';
      });
      if (enc.impayes) h += '<div class="r"><span class="l" style="color:var(--color-danger);font-weight:700">' + pl(enc.prelevementsImpayes || 1, 'prélèvement') + ' revenu' + ((enc.prelevementsImpayes || 1) > 1 ? 's' : '') + ' impayé' + ((enc.prelevementsImpayes || 1) > 1 ? 's' : '') + ' (' + pl(enc.impayes, 'bon') + ') — à régulariser avant de revendre</span><span class="v" style="color:var(--color-danger)">' + esc(D.eur(enc.impayeMontant)) + '</span></div>';
      if (!attente.length && !enc.impayes) h += '<div class="r"><span class="l">Rien en attente : tout ce que tu as vendu est réglé, ou parti au prélèvement.</span><span class="v"><a href="05-releves.html" class="pec-tap-confort" style="color:var(--color-primary-dark)">Relevés ›</a></span></div>';
      z.innerHTML = h;
    }

    function rendre() {
      var p = P.point(), r = P.revendeur(), R = D.techRef(), tb = $('bl-rows'), k = P.collab();
      if (!$('bl-enseigne')) return;
      $('bl-titre').textContent = k ? 'Mes ventes' : 'Bons vendus';
      document.title = 'PayEnCash PARTENAIRE — ' + (k ? 'Mes ventes' : 'Bons vendus');   // l'onglet dit la même chose que la page
      document.querySelector('.bl-table').classList.toggle('bl-table--moi', !!k);
      $('bl-du-titre').hidden = $('bl-du').hidden = !!k;   // ce que le point doit regarde le titulaire
      peindreVendeurs();
      $('bl-enseigne').textContent = p ? p.enseigne : 'aucun point rattaché';
      $('bl-delai').textContent = 'dans les ' + R.annulationMinutes + ' min';
      /* (24/09, soir — relecture juridique) le distributeur nomade n'ACHÈTE pas le bon : il le vend pour notre compte, sur ce qu'il
         a payé d'avance — la phrase suit le mode */
      $('bl-note').textContent = 'Un bon de marque vaut ' + D.bonsRef().validiteMois + ' mois et se dépense en une ou plusieurs fois, uniquement sur le site de la marque. '
        + (r && D.techPaieParAvance(r)
          ? 'Tu l’as vendu pour le compte de ' + R.nom + ' : son prix réseau s’est imputé sur ton avance — annuler le recrédite.'
          : 'Tu l’as acheté à ' + R.nom + ' en le vendant : son prix réseau part au prélèvement de l’arrêté — annuler dans les ' + R.annulationMinutes + ' min retire la vente du prélèvement.')
        + ' Un bon déjà utilisé ne s’annule plus : seule la marque peut encore rembourser.';
      if (!k) rendreDu();
      if (!p || !r) {
        $('bl-nb').textContent = '0'; $('bl-eur').textContent = '0 €'; $('bl-annules').textContent = '0';
        tb.innerHTML = '<tr data-fvide-row><td colspan="7" class="meta" style="text-align:center;padding:18px">' + (p ? 'Aucune fiche de vente rattachée à ce point.' : 'Aucun point rattaché à cette session.') + '</td></tr>';
        return;
      }
      var qm = { revendeurId: r.id, mois: D.techPeriodeCourante() }, fv = filtreVendeur(); if (fv) qm.par = fv;
      var mois = D.techVentes(qm);
      var vives = mois.filter(function (v) { return v.statut !== 'annulee'; });
      $('bl-nb').textContent = String(vives.length);
      $('bl-eur').textContent = D.eur(vives.reduce(function (a, v) { return a + v.montant; }, 0));
      $('bl-annules').textContent = String(mois.length - vives.length);
      var tous = bonsDuPoint();
      /* on ne redessine que si la liste a changé : un redessin perd le tri choisi par en-tête et la page courante — le bus
         réveille l'écran bien plus souvent que la liste ne bouge */
      var emp = (fv || '*') + '#' + tous.map(function (b) { var v = b.venteRef ? D.techVente(b.venteRef) : null; return b.code + '|' + b.etat + '|' + b.solde + '|' + (annulable(b, R) ? 1 : 0) + '|' + (v ? v.statut : '-'); }).join(';');
      if (emp === derniereEmpreinte && tb.children.length) return;
      derniereEmpreinte = emp;
      if (!tous.length) {
        tb.innerHTML = '<tr data-fvide-row><td colspan="7" class="meta" style="text-align:center;padding:18px">' + (fv && !k ? 'Aucun bon vendu par ce vendeur pour l\'instant.' : (k ? 'Tu n\'as vendu aucun bon pour l\'instant' : 'Aucun bon vendu pour l\'instant') + ' — la première vente se fait dans <a href="03-vendre.html" style="color:var(--color-primary-dark);font-weight:700">Vendre</a>.') + '</td></tr>';
        return;
      }
      tb.innerHTML = tous.map(function (b) {
        var d = new Date(b.emisLe || 0), iso = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        var ann = annulable(b, R), v = b.venteRef ? D.techVente(b.venteRef) : null;
        var detail = b.etat === 'cancelled' ? (b.motifAnnulation ? 'motif : ' + b.motifAnnulation : '')
          : b.etat === 'redeemed' ? (b.utiliseLe ? 'le ' + new Date(b.utiliseLe).toLocaleDateString('fr-FR') : '')
          : (b.solde < b.montant ? 'reste ' + D.eur(b.solde) + ' à dépenser' : (b.expireLe ? 'jusqu\'au ' + new Date(b.expireLe).toLocaleDateString('fr-FR') : ''));
        var pCell = v
          ? esc(D.eur(v.prixPoint)) + '<br><span class="pec-pill ' + esc(D.techVenteStatutPill(v.statut)) + '">' + esc(D.techVenteStatutLbl(v.statut)) + '</span>'
          : '<span class="mono">—</span>';
        return '<tr data-code="' + esc(b.code) + '">' +
          '<td><b>' + esc(masque(b.code)) + '</b><br><span class="mono">' + esc(b.marchand) + '</span></td>' +
          '<td data-s="' + esc(iso) + '">' + esc(d.toLocaleDateString('fr-FR')) + '<br><span class="mono">' + esc(pad(d.getHours()) + ':' + pad(d.getMinutes())) + '</span></td>' +
          '<td class="c-vendeur" data-s="' + esc(v ? D.vendeurNom(v.par) : '') + '">' + esc(v ? D.vendeurNom(v.par) : '—') + '</td>' +
          '<td class="n" data-s="' + esc(b.montant) + '">' + esc(D.eur(b.montant)) + '</td>' +
          '<td class="n c-du" data-s="' + esc(v ? v.prixPoint : -1) + '">' + pCell + '</td>' +
          '<td>' + pillEtat(b) + (detail ? '<br><span class="mono">' + esc(detail) + '</span>' : '') + '</td>' +
          '<td><div class="bl-act">' +
            (b.etat !== 'cancelled' ? '<button type="button" class="tap" data-reimprimer="' + esc(b.code) + '">Réimprimer</button>' : '') +
            (ann ? '<button type="button" class="tap" data-annuler="' + esc(b.code) + '" title="encore ' + esc(resteMin(b, R)) + ' min">Annuler</button>' : '') +
          '</div></td></tr>';
      }).join('');
    }

    /* L'ADRESSE ABSOLUE DE L'APP MES BONS sur le ticket réimprimé — la même que celle du comptoir : la fiche du bon. */
    function flashHTML(b) {
      var base = location.href, i = base.indexOf('/ui/'), racine = i > -1 ? base.slice(0, i) + '/ui/bons/' : '../bons/';
      var url = racine + '02-bon.html?code=' + encodeURIComponent(b.code);
      var qr = (window.PEC_QR && PEC_QR.svg) ? PEC_QR.svg(url, { size: 112 }) : '';
      return '<div class="pec-ordre" style="margin-top:10px"><div class="pec-ordre-qr">' + (qr || '<span>Flashcode indisponible sur cet appareil — le code suffit.</span>') + '</div>'
        + '<div class="pec-ordre-txt"><b>À scanner avec l’app Mes bons</b><span>Le bon s’y range au nom de son utilisateur et s’utilise chez ' + esc(b.marchand) + '.</span><span class="ref">' + esc(b.code) + '</span></div></div>';
    }

    // RÉIMPRIMER — le même ticket que la vente
    $('bl-rows').addEventListener('click', function (e) {
      var r = e.target.closest('[data-reimprimer]'), a = e.target.closest('[data-annuler]');
      if (r) {
        var b = trouver(r.getAttribute('data-reimprimer')); if (!b) { message('Bon introuvable parmi les bons de ce point.', false); return; }
        $('bl-motif').hidden = true; aAnnuler = null;
        $('bl-ticket-titre').textContent = 'Ticket ' + b.code + ' — ' + D.eur(b.montant);
        $('bl-ticket-html').innerHTML = D.techBonTicketHTML(b) + flashHTML(b);
        $('bl-ticket').hidden = false; $('bl-ticket').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        message('', true);
        return;
      }
      if (a) {
        var b2 = trouver(a.getAttribute('data-annuler')); if (!b2) { message('Bon introuvable parmi les bons de ce point.', false); return; }
        var v2 = b2.venteRef ? D.techVente(b2.venteRef) : null;
        aAnnuler = b2.code;
        $('bl-ticket').hidden = true;
        $('bl-motif-titre').textContent = 'Annuler le bon ' + masque(b2.code) + ' — ' + D.eur(b2.montant);
        $('bl-motif-txt').textContent = 'Émis le ' + new Date(b2.emisLe).toLocaleString('fr-FR') + ' · encore ' + resteMin(b2, D.techRef()) + ' min pour annuler au comptoir. Rembourse ton client : '
          + (v2 ? (v2.paiement === 'avance' ? 'les ' + D.eur(v2.prixPoint) + ' débités de ton avance te sont recrédités.' : 'la vente ' + v2.reference + ' (' + D.eur(v2.prixPoint) + ') sort du prochain prélèvement.') : 'rien ne sera prélevé pour ce bon.');
        $('bl-motif-txt-in').value = '';
        $('bl-motif').hidden = false; $('bl-motif').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); $('bl-motif-txt-in').focus();
        message('', true);
      }
    });
    $('bl-ticket-fermer').addEventListener('click', function () { $('bl-ticket').hidden = true; $('bl-ticket-html').innerHTML = ''; });
    $('bl-ticket-imprimer').addEventListener('click', function () { window.print(); });
    $('bl-motif-non').addEventListener('click', function () { $('bl-motif').hidden = true; aAnnuler = null; });
    // ANNULER — techBonAnnuler(code, { motif, par }) : chaque refus (motif vide, déjà utilisé, délai, vente prélevée) s'affiche tel quel
    $('bl-motif-ok').addEventListener('click', function () {
      var b = aAnnuler ? trouver(aAnnuler) : null;
      if (!b) { message('Aucun bon sélectionné.', false); return; }
      var r = D.techBonAnnuler(b.code, { motif: $('bl-motif-txt-in').value, par: P.par() });
      if (!r.ok) { message(r.motif, false); return; }
      $('bl-motif').hidden = true; aAnnuler = null;
      /* ce que l'annulation A FAIT, lu sur la vente rendue : recréditée, ou retirée du prélèvement — pas ce qu'on espère */
      var v = r.vente;
      message('✓ Bon ' + masque(b.code) + ' annulé (' + D.eur(b.montant) + ')' + (v ? (v.paiement === 'avance' ? ' — ' + D.eur(v.prixPoint) + ' recrédités sur ton avance.' : ' — la vente ' + v.reference + ' ne sera pas prélevée.') : '.') + ' Rembourse ton client.', true);
      derniereEmpreinte = null; rendre();
    });

    // (24/09, nuit) choisir un vendeur relit la liste depuis la source : ses bons, ses nombres du mois
    $('bl-vendeur').addEventListener('change', function () { derniereEmpreinte = null; rendre(); });
    rendre();
    // (écran non sourd) une vente, une annulation, un bon utilisé chez la marque, un prélèvement réglé ou impayé : la liste se repeint
    window.addEventListener('pec-bus', rendre);
    window.addEventListener('storage', rendre);
    setInterval(rendre, 60000);   // le délai d'annulation s'écoule : le bouton disparaît quand il expire
  })();
</script>
</body>
</html>
